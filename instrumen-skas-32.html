<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrumen SK@S Standard 3.2 — Edisi 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--pri:#1a3c6e;--sec:#2e86c1;--acc:#f39c12;--ok:#27ae60;--err:#e74c3c;--warn:#f1c40f;--purp:#8e44ad;--teal:#1abc9c;--bg:#f0f2f5;--card:#fff;--txt:#2c3e50;--mute:#7f8c8d;--bdr:#e0e0e0;--r:12px;--sh:0 2px 12px rgba(0,0,0,.08);--yellow:#f5b800;--dark:#1a1a1a;--red-hl:#c0392b;--blue-hl:#2980b9;--green-hl:#16a085;--purple-hl:#8e44ad}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;font-size:13px}
.top{background:linear-gradient(135deg,var(--pri),#0d2240);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.top h1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.top h1 i{color:var(--acc)}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top select{padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:600}
.top select option{color:#333;background:#fff}
.top .badge{background:var(--ok);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}
.btn{padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;transition:.2s}
.btn-back{background:rgba(255,255,255,.2);color:#fff}.btn-back:hover{background:rgba(255,255,255,.35)}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{opacity:.9}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{opacity:.9}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-outline{background:transparent;border:1.5px solid var(--bdr);color:var(--txt)}.btn-outline:hover{border-color:var(--pri);color:var(--pri)}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 12px;border-bottom:2px solid var(--bdr)}
.tab{padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;color:var(--mute);border:1.5px solid transparent;border-bottom:none;transition:.2s;background:transparent}
.tab:hover{color:var(--pri);background:rgba(26,60,110,.05)}
.tab.active{color:var(--pri);background:var(--card);border-color:var(--bdr);border-bottom:2px solid var(--card);margin-bottom:-2px}
.tab .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:5px}
.dot-g{background:var(--ok)}.dot-y{background:var(--warn)}.dot-o{background:#e67e22}.dot-r{background:var(--err)}.dot-x{background:#bdc3c7}
.aspek-panel{background:var(--card);border-radius:0 0 var(--r) var(--r);padding:20px;box-shadow:var(--sh)}

/* === PENJELASAN ASPEK (format PDF) === */
.penjelasan{border:1.5px solid var(--bdr);border-radius:8px;overflow:hidden;margin-bottom:18px}
.penj-row{display:flex;border-bottom:1px solid var(--bdr)}
.penj-row:last-child{border-bottom:none}
.penj-label{background:#f8fafc;padding:10px 14px;font-weight:800;font-size:11px;color:var(--dark);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;min-width:230px;border-right:1px solid var(--bdr);display:flex;align-items:center}
.penj-text{padding:10px 14px;font-size:13px;line-height:1.6;flex:1}
.banner-std{background:var(--dark);color:#fff;padding:10px 16px;text-align:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.banner-aspek{background:var(--yellow);color:var(--dark);padding:10px 16px;font-weight:800;font-size:13px}
.banner-subkod{background:var(--dark);color:#fff;padding:6px 14px;font-weight:800;font-size:12px;display:inline-block;border-radius:0 4px 4px 0;margin:8px 0 0;letter-spacing:.5px}
.hl-r{color:var(--red-hl);font-weight:600}
.hl-b{color:var(--blue-hl)}
.hl-g{color:var(--green-hl);font-weight:600}
.hl-p{color:var(--purple-hl);font-weight:600}

/* === RUBRIK PENSKORAN === */
.section-title{font-size:14px;font-weight:800;color:var(--pri);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title i{color:var(--sec)}
.rubrik{width:100%;border-collapse:collapse;font-size:11px;border:1.5px solid var(--bdr)}
.rubrik thead{background:var(--yellow);color:var(--dark)}
.rubrik thead th{padding:8px 10px;font-weight:800;text-align:center;border:1px solid var(--bdr);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.rubrik tbody td{padding:9px 11px;border:1px solid var(--bdr);vertical-align:top;font-size:11.5px;line-height:1.5}
.rubrik tbody tr:nth-child(even) td{background:#fcfcfc}
.rubrik td.tnd{font-weight:700;background:#fff8e7;width:170px;min-width:170px}
.rubrik td.tnd .tk{display:inline-block;background:var(--dark);color:#fff;font-weight:800;padding:1px 6px;border-radius:3px;font-size:10px;margin-right:5px}
.rubrik td.score-cell{width:140px;min-width:130px;font-size:11px}
.rubrik td.score-cell.win{background:#eafaf1!important;border:2px solid var(--ok)!important;font-weight:600}
.rubrik td.score-cell.win-text{color:var(--ok)}
.rubrik td ol{margin:0;padding-left:18px}
.rubrik td ol li{margin-bottom:3px;list-style-type:lower-roman}
.rubrik-label{background:var(--yellow);font-weight:700;text-align:center;padding:6px;font-size:11px;color:var(--dark);text-transform:uppercase;letter-spacing:.5px}

/* === SKOR === */
.skor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.skor-tnd{padding:12px;border-radius:8px;border:1.5px solid var(--bdr);background:#f8fafc}
.skor-tnd .stk{display:inline-block;background:var(--dark);color:#fff;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:800;margin-right:6px}
.skor-tnd .stn{font-size:11px;color:var(--mute);line-height:1.4;display:block;margin-top:4px}
.skor-tnd .sv{font-size:26px;font-weight:800;color:var(--pri)}
.skor-tnd.lo{border-color:var(--err);background:#fdedec}.skor-tnd.lo .sv{color:var(--err)}
.skor-tnd.mid{border-color:var(--warn);background:#fef9e7}.skor-tnd.mid .sv{color:#d4ac0d}
.skor-tnd.hi{border-color:var(--ok);background:#eafaf1}.skor-tnd.hi .sv{color:var(--ok)}
.skor-total{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 6px}
.skor-box{text-align:center;padding:14px;border-radius:var(--r);border:1.5px solid var(--bdr)}
.skor-box .skor-val{font-size:28px;font-weight:800;margin-bottom:2px}
.skor-box .skor-lbl{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.skor-ok{border-color:var(--ok);background:#eafaf1}.skor-ok .skor-val{color:var(--ok)}
.skor-warn{border-color:var(--warn);background:#fef9e7}.skor-warn .skor-val{color:#d4ac0d}
.skor-err{border-color:var(--err);background:#fdedec}.skor-err .skor-val{color:var(--err)}
.progress-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:6px 0}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .4s}

/* === EVIDENS === */
.fasa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.fasa-grid{grid-template-columns:1fr}}
.fasa-col{border:1.5px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.fasa-head{padding:10px 14px;font-size:12px;font-weight:800;color:#fff;display:flex;justify-content:space-between;align-items:center}
.fasa-1 .fasa-head{background:#2980b9}.fasa-2 .fasa-head{background:var(--teal)}.fasa-3 .fasa-head{background:var(--purp)}
.fasa-body{padding:8px;max-height:600px;overflow-y:auto}
.ev-item{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:6px;font-size:12px;margin-bottom:4px;background:#f8fafc;border:1px solid #eee;transition:.15s}
.ev-item:hover{border-color:var(--sec);background:#f0f7ff}
.ev-item input[type=checkbox]{margin-top:2px;accent-color:var(--ok);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.ev-item .ev-text{flex:1;line-height:1.4}
.ev-item .ev-text.done{text-decoration:line-through;color:var(--mute)}
.ev-actions{display:flex;gap:3px;flex-shrink:0}
.ev-actions button{width:22px;height:22px;border:none;border-radius:4px;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:.15s}
.ev-link{background:#eaf0fb;color:var(--sec)}.ev-link:hover{background:var(--sec);color:#fff}
.ev-link.has-url{background:var(--sec);color:#fff}
.ev-del{background:#fde;color:var(--err)}.ev-del:hover{background:var(--err);color:#fff}
.add-row{display:flex;gap:6px;padding:8px;border-top:1px solid #eee}
.add-row input{flex:1;padding:6px 10px;border:1.5px solid var(--bdr);border-radius:6px;font-size:12px}
.add-row input:focus{outline:none;border-color:var(--sec)}

/* === SUMMARY === */
.summary-strip{display:flex;gap:10px;overflow-x:auto;padding:8px 0;margin-bottom:4px}
.sum-chip{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;border:1.5px solid var(--bdr);background:var(--card)}
.sum-chip.hi{border-color:var(--ok);color:var(--ok)}.sum-chip.mid{border-color:var(--warn);color:#d4ac0d}.sum-chip.lo{border-color:var(--err);color:var(--err)}

.spkb-back-btn{position:fixed;top:12px;left:12px;z-index:99999;background:var(--pri);color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;align-items:center;gap:6px}
body.in-spkb .spkb-back-btn{display:flex}

@media print{.top,.tabs,.btn,.add-row,.ev-actions,.spkb-back-btn{display:none!important}.aspek-panel{break-inside:avoid;page-break-inside:avoid}}

/* === AUTO-PADAN BUTTON & MODAL === */
.auto-padan-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,#eafaf1,#d5f5e3);border:1.5px solid var(--ok);border-radius:8px;margin-bottom:14px;flex-wrap:wrap}
.auto-padan-bar .info{font-size:12px;color:#0e6251;font-weight:600}
.auto-padan-bar .info i{color:var(--ok);margin-right:5px}
.btn-padan{background:var(--ok);color:#fff;padding:8px 16px;font-size:12px;font-weight:700;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-padan:hover{opacity:.9;transform:translateY(-1px)}
.btn-padan:disabled{background:#bdc3c7;cursor:not-allowed;transform:none}
.padan-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.padan-modal.show{display:flex}
.padan-box{background:#fff;border-radius:14px;padding:24px;max-width:680px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.padan-box h3{font-size:16px;font-weight:800;color:var(--pri);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.padan-box .sub{font-size:12px;color:var(--mute);margin-bottom:16px}
.padan-list{border:1px solid var(--bdr);border-radius:8px;overflow:hidden;margin-bottom:14px}
.padan-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #eee;font-size:12px;gap:10px}
.padan-row:last-child{border-bottom:none}
.padan-row.match-hi{background:#eafaf1}
.padan-row.match-mid{background:#fef9e7}
.padan-row .ev-name{flex:1;font-weight:600;color:var(--txt)}
.padan-row .ev-match{flex:1;color:var(--sec);font-size:11px}
.padan-row .ev-score{background:var(--ok);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
.padan-row.match-mid .ev-score{background:var(--warn)}
.padan-row .ev-check{accent-color:var(--ok)}
.padan-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
// =============================================================
// HELPERS: storage, scoring
// =============================================================
const MEM={};
function sget(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]||null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}}

let currentYear = new Date().getFullYear();
let currentTab = 0;

function storageKey(aspekId, fasa){return `skas32_${currentYear}_${aspekId}_f${fasa}`}

function getEvidens(aspekId, fasa){
  const key = storageKey(aspekId, fasa);
  const saved = sget(key);
  if(saved) return JSON.parse(saved);
  const aspek = ASPEK_DATA.find(a=>a.id===aspekId);
  const fasaKey = 'f'+fasa;
  const defaults = (aspek && aspek.ev[fasaKey]) || [];
  return defaults.map((txt,i)=>({id:'d'+i, text:txt, done:false, link:''}));
}

function saveEvidens(aspekId, fasa, items){
  sset(storageKey(aspekId,fasa), JSON.stringify(items));
}

// =============================================================
// SCORING (0-4 mengikut PDF)
// pct >= 90 → 4 | 70 → 3 | 50 → 2 | 25 → 1 | <25 → 0
// =============================================================
function calcAspekPct(aspekId){
  let done=0,total=0;
  [1,2,3].forEach(f=>{const items=getEvidens(aspekId,f);total+=items.length;done+=items.filter(x=>x.done).length});
  return total?Math.round(done/total*100):0;
}
function pctToTahap(pct){
  if(pct>=90)return 4;
  if(pct>=70)return 3;
  if(pct>=50)return 2;
  if(pct>=25)return 1;
  return 0;
}

// =============================================================
// RENDER
// =============================================================
function render(){
  renderTabs();
  renderSummary();
  renderPanel(currentTab);
  updateSkorBadge();
}

function renderTabs(){
  const bar=document.getElementById('tabBar');
  bar.innerHTML = ASPEK_DATA.map((a,i)=>{
    const pct = calcAspekPct(a.id);
    const dotClass = pct>=80?'dot-g':pct>=60?'dot-y':pct>=40?'dot-o':pct>0?'dot-r':'dot-x';
    return `<button class="tab${i===currentTab?' active':''}" onclick="switchTab(${i})">${a.kod}<span class="dot ${dotClass}"></span></button>`;
  }).join('');
}

function renderSummary(){
  const strip=document.getElementById('summaryStrip');
  strip.innerHTML = ASPEK_DATA.map(a=>{
    const pct = calcAspekPct(a.id);
    const cls = pct>=80?'hi':pct>=40?'mid':'lo';
    const tahap = pctToTahap(pct);
    return `<div class="sum-chip ${cls}">${a.kod}: ${tahap}/4 · ${pct}%</div>`;
  }).join('');
}

// Apply color highlights ke teks SK / tindakan standard
function highlight(txt){
  // Pattern: kata-kata utama (verb/action) → merah
  let out = txt;
  const reds = ['diurus','dilaksanakan','dibuat','dirancang','dilantik','disusun'];
  const greens = ['secara sistematik dan terancang','secara profesional dan terancang','secara menyeluruh','secara kreatif/inovatif','dari semasa ke semasa','secara spesifik dan jelas'];
  const blues = ['untuk memastikan','untuk mengukuhkan','untuk meningkatkan','untuk mengoptimumkan','untuk memupuk','untuk mengesan'];
  // Apply purple to "Membuat, mendokumen, ..."
  out = out.replace(/^(Membuat, mendokumen, menyebar luas dan menyemak semula ketetapan|Merancang dan melaksanakan[^\.]+?(?=\s+dengan|\s+mengikut))/i, '<span class="hl-p">$1</span>');
  greens.forEach(g=>{
    out = out.replace(new RegExp(g, 'gi'), '<span class="hl-g">$&</span>');
  });
  blues.forEach(b=>{
    out = out.replace(new RegExp(b, 'gi'), '<span class="hl-b">$&</span>');
  });
  reds.forEach(r=>{
    out = out.replace(new RegExp('\\b'+r+'\\b', 'gi'), '<span class="hl-r">$&</span>');
  });
  return out;
}

function renderPanel(idx){
  const a = ASPEK_DATA[idx];
  const pct = calcAspekPct(a.id);
  const tahap = pctToTahap(pct);
  let h = '<div class="aspek-panel">';

  // === PENJELASAN ASPEK ===
  h += '<div class="penjelasan">';
  h += '<div class="banner-std">STANDARD 3.2 : PENGURUSAN KOKURIKULUM</div>';
  h += `<div class="banner-aspek">ASPEK ${a.kod} : ${a.nama}</div>`;
  h += `<div class="penj-row"><div class="penj-label">Kriteria Kritikal</div><div class="penj-text">${highlight(a.kk)}</div></div>`;
  h += `<div style="padding:6px 14px;background:#f8fafc;"><span class="banner-subkod">${a.sub}</span></div>`;
  h += `<div class="penj-row"><div class="penj-label">Standard Kualiti</div><div class="penj-text">${highlight(a.sk)}</div></div>`;
  h += `<div class="penj-row"><div class="penj-label">Tindakan untuk Mencapai Standard</div><div class="penj-text">${highlight(a.ts)}</div></div>`;
  h += '</div>';

  // === RUBRIK PENSKORAN (format PDF: TINDAKAN x PENSKORAN 4|3|2|1|0) ===
  h += `<div class="section-title"><i class="fas fa-list-ol"></i> Rubrik Penskoran (Tahap Auto: <strong style="color:${tahap>=3?'var(--ok)':tahap>=2?'#d4ac0d':'var(--err)'}">${tahap}/4</strong>)</div>`;
  h += '<table class="rubrik">';
  h += '<thead><tr><th rowspan="2" style="width:170px;">TINDAKAN</th><th colspan="5">PENSKORAN</th></tr>';
  h += '<tr><th class="rubrik-label">4</th><th class="rubrik-label">3</th><th class="rubrik-label">2</th><th class="rubrik-label">1</th><th class="rubrik-label">0</th></tr></thead>';
  h += '<tbody>';
  // Baris label (e.g., "Mengurus pelaksanaan kokurikulum:")
  h += `<tr><td colspan="6" style="background:#f8fafc;font-weight:800;font-size:12px;padding:8px 11px;color:var(--dark);">${a.tl}</td></tr>`;
  // Setiap tindakan
  a.tindakan.forEach(t=>{
    // Score-4 criteria sebagai ordered list
    let t4 = '<ol>';
    t.t4.forEach(item=>{ t4 += `<li>${item}</li>`; });
    t4 += '</ol>';
    // Score 3, 2, 1, 0 berdasarkan skema
    let s3, s2, s1, s0;
    if(a.skema === 'A'){
      s3 = 'dengan mengambil kira perkara (i) dan mana-mana dua (2) perkara';
      s2 = 'dengan mengambil kira perkara (i) dan mana-mana satu (1) perkara';
      s1 = 'dengan mengambil kira mana-mana perkara (ii) atau (iii) atau (iv)';
      s0 = 'tidak mengambil kira mana-mana perkara';
    } else { // skema B (3.2.5)
      s3 = 'dengan mengambil kira mana-mana tiga (3) perkara';
      s2 = 'dengan mengambil kira mana-mana dua (2) perkara';
      s1 = 'dengan mengambil kira mana-mana satu (1) perkara';
      s0 = 'tidak mengambil kira mana-mana perkara';
    }
    const cells = [{n:4,t:t4},{n:3,t:s3},{n:2,t:s2},{n:1,t:s1},{n:0,t:s0}];
    h += `<tr>`;
    h += `<td class="tnd"><span class="tk">${t.kod})</span>${t.nama}</td>`;
    cells.forEach(c=>{
      const win = (c.n === tahap);
      h += `<td class="score-cell${win?' win':''}">${c.t}${win?'<div style="margin-top:6px;font-size:10px;color:var(--ok);font-weight:800;">✓ TAHAP DIKIRA</div>':''}</td>`;
    });
    h += `</tr>`;
  });
  h += '</tbody></table>';

  // === SKOR AUTOMATIK PER TINDAKAN ===
  h += '<div class="section-title"><i class="fas fa-chart-bar"></i> Skor Automatik Setiap Tindakan</div>';
  h += '<div class="skor-grid">';
  a.tindakan.forEach(t=>{
    const cls = tahap>=3?'hi':tahap>=2?'mid':'lo';
    h += `<div class="skor-tnd ${cls}"><span class="stk">${t.kod})</span><span style="font-weight:700;font-size:12px;">${t.nama.length>40?t.nama.substring(0,40)+'…':t.nama}</span><div style="margin-top:8px;text-align:center;"><span class="sv">${tahap}/4</span></div></div>`;
  });
  h += '</div>';

  // Ringkasan
  const totalMax = a.tindakan.length * 4;
  const totalScore = a.tindakan.length * tahap;
  const barColor = tahap>=3?'var(--ok)':tahap>=2?'var(--warn)':'var(--err)';
  const clsBox = tahap>=3?'skor-ok':tahap>=2?'skor-warn':'skor-err';
  h += '<div class="skor-total">';
  h += `<div class="skor-box ${clsBox}"><div class="skor-val">${tahap}/4</div><div class="skor-lbl">Tahap Aspek ${a.kod}</div></div>`;
  h += `<div class="skor-box"><div class="skor-val">${totalScore}/${totalMax}</div><div class="skor-lbl">Jumlah Markah</div></div>`;
  h += `<div class="skor-box"><div class="skor-val">${pct}%</div><div class="skor-lbl">Kelengkapan Evidens</div></div>`;
  h += `<div class="skor-box"><div class="skor-val">${a.tindakan.length}</div><div class="skor-lbl">Tindakan</div></div>`;
  h += '</div>';
  h += `<div class="progress-bar"><div class="fill" style="width:${pct}%;background:${barColor}"></div></div>`;

  // === EVIDENS PELAKSANAAN (kekal dari versi lama) ===
  h += `<div class="section-title"><i class="fas fa-folder-open"></i> Evidens Pelaksanaan — Tahun ${currentYear}</div>`;
  h += `<div class="auto-padan-bar"><div class="info"><i class="fas fa-magic"></i> Padankan evidens dengan fail dalam modul Pengurusan Fail SK@S secara automatik</div><button class="btn-padan" onclick="autoPadan('${a.id}')"><i class="fas fa-link"></i> Auto-Padan dengan SK@S</button></div>`;
  h += '<div class="fasa-grid">';
  [1,2,3].forEach(f=>{
    const labels = ['','Fasa 1 (Jan–Mac)','Fasa 2 (Apr–Jul)','Fasa 3 (Ogos–Okt)'];
    const items = getEvidens(a.id, f);
    const done = items.filter(x=>x.done).length;
    h += `<div class="fasa-col fasa-${f}">`;
    h += `<div class="fasa-head">${labels[f]}<span>${done}/${items.length}</span></div>`;
    h += `<div class="fasa-body">`;
    items.forEach((it,i)=>{
      const linkCls = it.link ? 'ev-link has-url' : 'ev-link';
      const linkTitle = it.link ? 'Pautan: '+it.link.substring(0,40) : 'Pautan fail/Drive';
      h += `<div class="ev-item">`;
      h += `<input type="checkbox" ${it.done?'checked':''} onchange="toggleEv('${a.id}',${f},${i})">`;
      h += `<span class="ev-text${it.done?' done':''}">${it.text}</span>`;
      h += `<div class="ev-actions">`;
      h += `<button class="${linkCls}" title="${linkTitle}" onclick="linkEv('${a.id}',${f},${i})"><i class="fas fa-link"></i></button>`;
      h += `<button class="ev-del" title="Padam" onclick="delEv('${a.id}',${f},${i})"><i class="fas fa-times"></i></button>`;
      h += `</div></div>`;
    });
    h += `</div>`;
    h += `<div class="add-row"><input placeholder="Tambah evidens…" id="add-${a.id}-${f}" onkeydown="if(event.key==='Enter')addEv('${a.id}',${f})"><button class="btn btn-ok btn-sm" onclick="addEv('${a.id}',${f})"><i class="fas fa-plus"></i></button></div>`;
    h += `</div>`;
  });
  h += '</div>';

  h += '</div>'; // /aspek-panel
  document.getElementById('panels').innerHTML = h;
}

function updateSkorBadge(){
  const avg = Math.round(ASPEK_DATA.reduce((s,a)=>s+calcAspekPct(a.id),0)/ASPEK_DATA.length);
  const badge = document.getElementById('skorBadge');
  badge.textContent = pctToTahap(avg)+'/4 · '+avg+'%';
  badge.style.background = avg>=80?'var(--ok)':avg>=60?'var(--warn)':'var(--err)';
}

// =============================================================
// ACTIONS
// =============================================================
function switchTab(idx){currentTab=idx;render()}
function switchYear(y){currentYear=parseInt(y);render()}

function toggleEv(aspekId,fasa,idx){
  const items = getEvidens(aspekId,fasa);
  items[idx].done = !items[idx].done;
  saveEvidens(aspekId,fasa,items);
  render();
}

function addEv(aspekId,fasa){
  const input = document.getElementById(`add-${aspekId}-${fasa}`);
  const txt = input.value.trim();
  if(!txt) return;
  const items = getEvidens(aspekId,fasa);
  items.push({id:'u'+Date.now(),text:txt,done:false,link:''});
  saveEvidens(aspekId,fasa,items);
  input.value = '';
  render();
}

function delEv(aspekId,fasa,idx){
  if(!confirm('Padam evidens ini?')) return;
  const items = getEvidens(aspekId,fasa);
  items.splice(idx,1);
  saveEvidens(aspekId,fasa,items);
  render();
}

function linkEv(aspekId,fasa,idx){
  const items = getEvidens(aspekId,fasa);
  const url = prompt('Masukkan URL fail/Drive:', items[idx].link || '');
  if(url === null) return;
  items[idx].link = url;
  saveEvidens(aspekId,fasa,items);
  if(url) window.open(url,'_blank');
  else render();
}


// =============================================================
// AUTO-PADAN: hubung dengan modul Pengurusan Fail SK@S
// =============================================================
const SKAS_API = 'https://script.google.com/macros/s/AKfycbxTXUFFwssqT7Nwg5sJ6tWsVUMD_-zV2h2S35lymOgTW88iVaT1mqag2yHfBoShTWA/exec';
let padanCache = null;       // cache fail SK@S
let padanCurrent = null;     // padanan semasa { aspekId, items: [{evIdx, fasa, fileName, fileUrl, score}] }

// Levenshtein-based similarity (0-1)
function similarity(a, b){
  a = a.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  b = b.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  if(!a || !b) return 0;
  // Token-based: jumlah token sepadan / token tertinggi
  const ta = a.split(' ').filter(x=>x.length>=3);
  const tb = b.split(' ').filter(x=>x.length>=3);
  if(!ta.length || !tb.length) return 0;
  let match = 0;
  ta.forEach(t=>{ if(tb.some(u=>u.includes(t)||t.includes(u))) match++; });
  return match / Math.max(ta.length, tb.length);
}

async function autoPadan(aspekId){
  const modal = document.getElementById('padanModal');
  const list = document.getElementById('padanList');
  const applyBtn = document.getElementById('padanApplyBtn');
  applyBtn.disabled = true;
  list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--mute);"><div style="width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:var(--ok);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;"></div>Memuatkan data SK@S…</div>';
  modal.classList.add('show');

  try {
    // Muatkan data SK@S sekali sahaja (cache)
    if(!padanCache){
      // Langkah 1: Ambil senarai folder dari skas_dashboard
      list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--mute);"><div style="width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:var(--ok);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;"></div>Mendapatkan senarai folder SK@S…</div>';
      const respDash = await fetch(SKAS_API + '?action=skas_dashboard&_t=' + Date.now());
      const jsonDash = await respDash.json();
      if(!jsonDash.success) throw new Error(jsonDash.error || 'Gagal muat dashboard SK@S');
      const folders = (jsonDash.data && jsonDash.data.folders) || [];
      if(!folders.length){
        list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--err);"><i class="fas fa-exclamation-circle" style="font-size:32px;"></i><div style="margin-top:10px;">Tiada folder SK@S dijumpai dalam dashboard.<br><small>Pastikan modul Pengurusan Fail SK@S diaktifkan dan ada data.</small></div></div>';
        return;
      }

      // Langkah 2: Ambil fail dari setiap folder (selari)
      list.innerHTML = `<div style="text-align:center;padding:30px;color:var(--mute);"><div style="width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:var(--ok);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;"></div>Memuatkan fail dari ${folders.length} folder SK@S…<div style="font-size:11px;margin-top:6px;color:#bdc3c7;">Sila tunggu, ini mungkin ambil masa beberapa saat</div></div>`;

      const folderPromises = folders.map(f => {
        const folderNo = f.no || f.folder_no || f.standard_id;
        if(!folderNo) return Promise.resolve({success:false, _f:f});
        return fetch(SKAS_API + '?action=skas_folder_detail&no=' + encodeURIComponent(folderNo) + '&_t=' + Date.now())
          .then(r => r.json())
          .then(d => { d._f = f; return d; })
          .catch(e => ({success:false, _f:f, error:e.message}));
      });

      const details = await Promise.all(folderPromises);

      // Langkah 3: Agregat semua fail
      const files = [];
      details.forEach(d => {
        if(!d.success || !d.data) return;
        const folderInfo = d.data.folder || d._f || {};
        const fList = d.data.files || [];
        fList.forEach(file => {
          // Skip jika ini sebenarnya subfolder, bukan fail
          if(file.jenis === 'Folder' || file.jenis === 'folder') return;
          const fileName = file.nama_fail || file.nama || file.name || '';
          const fileUrl = file.url || file.link || '';
          if(!fileName || !fileUrl) return;
          files.push({
            folderNama: folderInfo.nama_folder || folderInfo.folder_nama || '',
            folderNo: folderInfo.no || '',
            standardId: folderInfo.standard_id || '',
            fileName: fileName,
            fileUrl: fileUrl,
            lastUpdate: file.last_update || file.tarikh_kemaskini || ''
          });
        });
      });
      padanCache = files;
    }

    if(!padanCache.length){
      list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--err);"><i class="fas fa-exclamation-circle" style="font-size:32px;"></i><div style="margin-top:10px;">Tiada fail dijumpai dalam mana-mana folder SK@S.<br><small>Pastikan ada fail yang sudah dimuat naik ke Google Drive dan ter-sync dengan modul Pengurusan Fail.</small></div></div>';
      return;
    }

    // Padan setiap evidens dengan fail SK@S
    const aspek = ASPEK_DATA.find(a=>a.id===aspekId);
    const aspekStd = aspek.kod; // contoh "3.2.1"
    const padanan = [];
    [1,2,3].forEach(f=>{
      const evidens = getEvidens(aspekId, f);
      evidens.forEach((ev, idx)=>{
        if(ev.link) return; // skip jika sudah ada link
        let best = null;
        padanCache.forEach(file=>{
          let score = similarity(ev.text, file.fileName);
          // Bonus jika fail dari folder dgn standard_id yang sama dgn aspek
          if(file.standardId && file.standardId.indexOf(aspekStd) !== -1){
            score = Math.min(1, score + 0.15);
          }
          if(score > 0.4 && (!best || score > best.score)){
            best = { file: file, score: score };
          }
        });
        if(best){
          padanan.push({
            fasa: f,
            evIdx: idx,
            evText: ev.text,
            fileName: best.file.fileName,
            fileUrl: best.file.fileUrl,
            folderNama: best.file.folderNama,
            folderNo: best.file.folderNo,
            standardId: best.file.standardId,
            score: best.score
          });
        }
      });
    });

    padanCurrent = { aspekId: aspekId, items: padanan };

    if(!padanan.length){
      list.innerHTML = `<div style="text-align:center;padding:30px;color:var(--mute);"><i class="fas fa-info-circle" style="font-size:32px;"></i><div style="margin-top:10px;">Tiada padanan dijumpai dengan ${padanCache.length} fail dalam SK@S.<br><small>Cuba semak format nama fail di Google Drive — perlu lebih dekat dengan nama evidens.</small></div></div>`;
      applyBtn.disabled = true;
      return;
    }

    // Papar cadangan
    document.getElementById('padanSub').innerHTML = `<strong>${padanan.length}</strong> cadangan padanan dijumpai untuk Aspek <strong>${aspek.kod}</strong> daripada ${padanCache.length} fail SK@S. Pilih yang sesuai.`;
    list.innerHTML = padanan.map((p,i)=>{
      const cls = p.score >= 0.7 ? 'match-hi' : 'match-mid';
      const pct = Math.round(p.score*100);
      const folderTag = p.folderNama ? `<div style="font-size:10px;color:var(--mute);margin-top:2px;"><i class="fas fa-folder" style="color:var(--acc);"></i> ${p.folderNama}${p.standardId?' · '+p.standardId:''}</div>` : '';
      return `<div class="padan-row ${cls}">
        <input type="checkbox" class="ev-check" id="pd-${i}" ${p.score>=0.7?'checked':''}>
        <label for="pd-${i}" class="ev-name" style="cursor:pointer;">${p.evText}</label>
        <div class="ev-match" style="display:flex;flex-direction:column;">
          <span>→ ${p.fileName}</span>
          ${folderTag}
        </div>
        <span class="ev-score">${pct}%</span>
      </div>`;
    }).join('');
    applyBtn.disabled = false;

  } catch(e){
    list.innerHTML = `<div style="text-align:center;padding:30px;color:var(--err);"><i class="fas fa-exclamation-triangle" style="font-size:32px;"></i><div style="margin-top:10px;">Ralat: ${e.message}</div></div>`;
  }
}

function applyPadan(){
  if(!padanCurrent) return;
  let applied = 0;
  padanCurrent.items.forEach((p,i)=>{
    const cb = document.getElementById('pd-'+i);
    if(cb && cb.checked && p.fileUrl){
      const items = getEvidens(padanCurrent.aspekId, p.fasa);
      if(items[p.evIdx]){
        items[p.evIdx].link = p.fileUrl;
        saveEvidens(padanCurrent.aspekId, p.fasa, items);
        applied++;
      }
    }
  });
  closePadanModal();
  if(applied > 0){
    render();
    alert(`✅ ${applied} pautan berjaya ditetapkan.`);
  }
}

function closePadanModal(){
  document.getElementById('padanModal').classList.remove('show');
  padanCurrent = null;
}

(function init(){
  const sel = document.getElementById('yearSelect');
  const now = new Date().getFullYear();
  for(let y=now; y>=now-5; y--){
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    if(y===currentYear) opt.selected = true;
    sel.appendChild(opt);
  }
  try{if(window!==window.top) document.body.classList.add('in-spkb')}catch(e){}
  const p = new URLSearchParams(window.location.search);
  if(p.get('tahun')) currentYear = parseInt(p.get('tahun'));
  render();
})();
</script>
